services:
  # Web Dashboard Service (Interactive CRM, Map, Configuration UI)
  dashboard:
    # Publiczny gotowy obraz z GHCR (po release). Lokalnie nadal działa `docker compose up --build`.
    image: ghcr.io/p-sternik/universal-real-estate-hunter:${IMAGE_TAG:-latest}
    build: .
    container_name: estate_hunter_dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/listings.db
      - SEARCH_CONFIG_PATH=/app/data/search_config.json
      - TZ=Europe/Warsaw
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    volumes:
      - estate_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/config"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    command: ["python", "main.py", "dashboard", "--host", "0.0.0.0", "--port", "8080", "--no-open"]

  # Automated Background Scraper & Monitoring Daemon
  scraper:
    image: ghcr.io/p-sternik/universal-real-estate-hunter:${IMAGE_TAG:-latest}
    build: .
    container_name: estate_hunter_scraper
    restart: unless-stopped
    depends_on:
      - dashboard
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/listings.db
      - SEARCH_CONFIG_PATH=/app/data/search_config.json
      - TZ=Europe/Warsaw
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    volumes:
      - estate_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'main.py run' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    command: ["python", "main.py", "run"]

volumes:
  estate_data:
