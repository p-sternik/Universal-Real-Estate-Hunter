[project]
name = "rzeszow-houses-scrapper"
version = "1.0.0"
description = "Advanced real estate monitoring and analytical pipeline for houses in Rzeszów"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "selectolax>=0.3.20",
    "apscheduler>=3.10.0",
    "tenacity>=8.3.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.9.0",
    "openai>=1.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
